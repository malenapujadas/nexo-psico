<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>nexopsico</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Los links de recuperación de contraseña de Supabase llegan con los tokens
      // en el hash de la URL (ej. #access_token=...&type=recovery). Como el sitio
      // usa HashRouter, ese hash no matchea ninguna ruta y la app queda en blanco.
      // Lo reescribimos ACÁ, antes de que se cargue cualquier módulo de React o
      // del cliente de Supabase, para que la ruta correcta ya esté resuelta desde
      // el primer render y no dependa de ganarle una carrera a ningún evento
      // asincrónico interno de la librería de auth.
      (function () {
        var rawHash = window.location.hash;
        if (rawHash.indexOf('type=recovery') !== -1 && rawHash.indexOf('access_token=') !== -1) {
          window.location.hash = '/actualizar-password?' + rawHash.slice(1);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
